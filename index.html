<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flat 2, 42 Esplanade — Your Stay Guide</title>
  <style>
    :root {
      --blue-deep:    #2a6b8a;
      --blue-mid:     #4a9bbe;
      --blue-light:   #cce9f5;
      --sand:         #f5ede0;
      --sand-dark:    #e8d8c4;
      --cream:        #fdf9f5;
      --text:         #2c3e3a;
      --text-light:   #5a7068;
      --white:        #ffffff;
      --accent:       #e07b39;
      --green:        #3a7d5a;
      --rule-red:     #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.7;
    }
    header {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 100px 24px 80px;
      color: var(--white);
    }
    .header-bg {
      position: absolute;
      inset: 0;
      background-image: url('./fowey.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    .header-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(42,107,138,0.75) 0%, rgba(74,155,190,0.65) 60%, rgba(92,179,212,0.55) 100%);
      z-index: 1;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0; right: 0;
      height: 60px;
      background: var(--cream);
      clip-path: ellipse(55% 100% at 50% 100%);
      z-index: 2;
    }
    header .header-content {
      position: relative;
      z-index: 3;
    }
    .wave-emoji { font-size: 2.4rem; display: block; margin-bottom: 12px; }
    header h1 {
      font-size: 2.6rem;
      font-weight: normal;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    header p.subtitle {
      font-size: 1.1rem;
      opacity: 0.92;
      font-style: italic;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    nav {
      background: var(--white);
      border-bottom: 2px solid var(--blue-light);
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(42,107,138,0.10);
    }
    .nav-scroll {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 12px;
    }
    .nav-scroll::-webkit-scrollbar { display: none; }
    nav a {
      color: var(--blue-deep);
      text-decoration: none;
      font-family: 'Arial', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 14px 14px;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    nav a:hover { border-bottom-color: var(--accent); color: var(--accent); }
    .section {
      max-width: 860px;
      margin: 0 auto;
      padding: 52px 24px 20px;
    }
    .section + .section {
      border-top: 1px solid var(--sand-dark);
      margin-top: 8px;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .section-icon { font-size: 2rem; flex-shrink: 0; }
    .section-header h2 {
      font-size: 1.7rem;
      font-weight: normal;
      color: var(--blue-deep);
    }
    .card {
      background: var(--white);
      border: 1px solid var(--sand-dark);
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .card h3 {
      font-size: 1.1rem;
      color: var(--blue-deep);
      margin-bottom: 8px;
      font-weight: bold;
      font-family: 'Arial', sans-serif;
    }
    .card p, .card li { font-size: 0.95rem; color: var(--text); }
    .card ul, .card ol { padding-left: 20px; margin-top: 8px; }
    .card li { margin-bottom: 5px; }
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) { .card-grid { grid-template-columns: 1fr; } }
    .keybox-box {
      background: var(--blue-deep);
      color: var(--white);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 16px;
    }
    .keybox-box .kb-label {
      font-family: 'Arial', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.8;
      margin-bottom: 6px;
    }
    .keybox-box .kb-location { font-size: 1.1rem; margin-bottom: 20px; font-style: italic; }
    .kb-code-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; }
    .kb-code-label { font-family: 'Arial', sans-serif; font-size: 0.85rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.08em; }
    .kb-code { font-family: 'Courier New', monospace; font-size: 2rem; letter-spacing: 0.25em; font-weight: bold; background: rgba(255,255,255,0.15); padding: 6px 18px; border-radius: 8px; }
    .rules-list { list-style: none; padding: 0; }
    .rules-list li { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--sand-dark); font-size: 0.95rem; }
    .rules-list li:last-child { border-bottom: none; }
    .rule-icon { font-size: 1.3rem; flex-shrink: 0; margin-top: 1px; }
    .steps { counter-reset: step-counter; list-style: none; padding: 0; margin-top: 8px; }
    .steps li { counter-increment: step-counter; display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; font-size: 0.95rem; }
    .steps li::before { content: counter(step-counter); background: var(--blue-mid); color: white; font-family: 'Arial', sans-serif; font-size: 0.8rem; font-weight: bold; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .place-card { background: var(--white); border: 1px solid var(--sand-dark); border-left: 4px solid var(--blue-mid); border-radius: 8px; padding: 16px 18px; margin-bottom: 12px; }
    .place-card.green { border-left-color: var(--green); }
    .place-card.accent { border-left-color: var(--accent); }
    .place-card h4 { font-family: 'Arial', sans-serif; font-size: 1rem; font-weight: bold; color: var(--text); margin-bottom: 4px; }
    .place-card .tags { margin-bottom: 6px; }
    .tag { display: inline-block; background: var(--blue-light); color: var(--blue-deep); font-size: 0.72rem; font-family: 'Arial', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 20px; margin-right: 4px; }
    .tag.green-tag { background: #d4ede1; color: var(--green); }
    .tag.accent-tag { background: #fce8d8; color: var(--accent); }
    .place-card p { font-size: 0.9rem; color: var(--text-light); }
    .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--sand-dark); font-size: 0.95rem; }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: var(--text-light); font-family: 'Arial', sans-serif; font-size: 0.85rem; }
    .info-row .value { font-weight: bold; font-family: 'Courier New', monospace; font-size: 1.05rem; color: var(--blue-deep); }
    .tip { background: var(--sand); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 12px 16px; font-size: 0.88rem; color: var(--text-light); margin-top: 12px; font-style: italic; }
    .tip strong { color: var(--accent); font-style: normal; }
    .emergency-bar { background: var(--rule-red); color: white; text-align: center; padding: 14px 24px; font-family: 'Arial', sans-serif; font-size: 0.9rem; }
    .emergency-bar a { color: white; font-weight: bold; }
    footer { background: var(--blue-deep); color: rgba(255,255,255,0.7); text-align: center; padding: 32px 24px; font-size: 0.85rem; margin-top: 48px; }
    footer strong { color: white; }
    @media (max-width: 480px) { header h1 { font-size: 1.9rem; } .section { padding: 36px 18px 16px; } .kb-code { font-size: 1.5rem; } }
  </style>
</head>
<body>
<header>
  <div class="header-bg"></div>
  <div class="header-overlay"></div>
  <div class="header-content">
    <span class="wave-emoji">🌊</span>
    <h1>Flat 2, 42 Esplanade</h1>
    <p class="subtitle">Fowey, Cornwall</p>
  </div>
</header>
